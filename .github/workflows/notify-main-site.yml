# 作用: 本仓库 main 分支收到 push 时,通过 repository_dispatch
#       通知 EMU-Stu-Site 主站与 IOT-lab-web 实验室站重新构建与部署。
#
# 鉴权: 复用 GitHub App 临时 token,不用 PAT。
#   依赖的 secret(配在本仓库 Settings → Secrets and variables → Actions):
#     APP_ID          -- GitHub App 的 App ID
#     APP_PRIVATE_KEY -- GitHub App 的私钥 (PEM 全文)
#   前置条件: 该 GitHub App 需对 EMU-Stu-Site、IOT-lab-web 有访问权,
#            且 App 权限包含 Contents: Read and write
#            (repository_dispatch 接口要求 contents 写权限)。

name: Notify sites

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  dispatch:
    runs-on: ubuntu-latest
    steps:
      # 1. 用 GitHub App 生成针对目标仓库的临时 token
      - name: Generate GitHub App Token
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          app-id: ${{ secrets.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
          owner: EMU-Stu
          repositories: |
            EMU-Stu-Site
            IOT-lab-web
          permission-contents: write

      # 2. 通知主站重新构建
      - name: Dispatch docs-updated to EMU-Stu-Site
        uses: peter-evans/repository-dispatch@v3
        with:
          token: ${{ steps.app-token.outputs.token }}
          repository: EMU-Stu/EMU-Stu-Site
          event-type: docs-updated

      # 3. 通知物联网实验室站重新构建
      - name: Dispatch docs-updated to IOT-lab-web
        uses: peter-evans/repository-dispatch@v3
        with:
          token: ${{ steps.app-token.outputs.token }}
          repository: EMU-Stu/IOT-lab-web
          event-type: docs-updated
